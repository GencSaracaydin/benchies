[project]
name = "benchies"
version = "0.1.0"
description = "Benchmark harness for FLUX Schnell inference experiments"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.9.0",
    "clip @ git+https://github.com/openai/CLIP.git",
    "diffusers>=0.35.0",
    "huggingface-hub>=0.34.0",
    "image-reward>=1.5",
    "pillow>=11.3.0",
    "safetensors>=0.5.3",
    "sentencepiece>=0.2.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "transformers>=4.55.0",
]

[project.scripts]
benchies = "benchies.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchies"]

[tool.hatch.metadata]
allow-direct-references = true
